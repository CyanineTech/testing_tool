map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # 静态前端页面
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/conf.d/auth.inc;

    # 主页面
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 脚本服务 API 代理
    location = /api/v1/scripts {
        proxy_pass http://tool-script-runner:8000/api/v1/scripts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/scripts/ {
        proxy_pass http://tool-script-runner:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;

        # SSE 支持
        chunked_transfer_encoding on;
    }

    # Camera simulator proxy
    location = /api/v1/camera/events {
        proxy_pass http://tool-camera-sim:8002/api/v1/camera/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    location /api/v1/camera/ {
        proxy_pass http://tool-camera-sim:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # Nginx 自身健康检查
    location /nginx-health {
        access_log off;
        auth_basic off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
