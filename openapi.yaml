openapi: 3.0.3
info:
  title: Testing Tool Platform API
  version: 1.0.0
servers:
  - url: http://localhost:5000
paths:
  /api/v1/scripts:
    get:
      summary: List available scripts
      responses:
        '200': {description: Script metadata map}
  /api/v1/scripts/execute/{script_name}:
    post:
      summary: Start one script
      parameters:
        - {name: script_name, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                args: {type: array, items: {type: string}, maxItems: 64}
      responses:
        '200': {description: Process started}
        '409': {description: Script already running}
  /api/v1/scripts/process/{process_id}/output:
    get:
      summary: Stream process output using Server-Sent Events
      parameters:
        - {name: process_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: SSE stream, content: {text/event-stream: {schema: {type: string}}}}
  /api/v1/scripts/process/{process_id}/stop:
    post:
      summary: Stop a running process
      parameters:
        - {name: process_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Process stopped}
  /api/v1/camera/list-all:
    get:
      summary: List camera mock records
      responses:
        '200': {description: Camera records}
  /api/v1/camera/settings:
    get:
      summary: List camera auto-timestamp settings without changing camera record output
      responses:
        '200': {description: Disabled auto-timestamp record names}
  /api/v1/camera/list/set-auto-update/{name}/{enabled}:
    post:
      summary: Enable or disable automatic timestamp updates for one record
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: enabled, in: path, required: true, schema: {type: string, enum: ['0', '1']}}
      responses:
        '200': {description: Updated auto-timestamp settings}
  /api/v1/camera/events:
    get:
      summary: Stream camera state changes using Server-Sent Events
      responses:
        '200': {description: SSE stream, content: {text/event-stream: {schema: {type: string}}}}
  /health:
    get:
      summary: Service health check
      responses:
        '200': {description: Healthy}
